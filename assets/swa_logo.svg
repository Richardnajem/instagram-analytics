<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background gradient: deep navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1327"/>
      <stop offset="50%" stop-color="#070b18"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Globe gradient: violet to cyan -->
    <radialGradient id="globeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="30%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="65%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="1"/>
    </radialGradient>

    <!-- Outer ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Chart bar gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="1"/>
    </linearGradient>
    
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feComposite in="shadow" in2="SourceGraphic" operator="over"/>
    </filter>

    <!-- Glow ring filter -->
    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern for globe -->
    <pattern id="gridPattern" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    
    <!-- Globe clip -->
    <clipPath id="globeClip">
      <circle cx="200" cy="220" r="115"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect x="8" y="8" width="496" height="496" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="3" filter="url(#ringGlow)"/>

  <!-- Subtle inner glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="80" ry="80" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>

  <!-- Ambient glow behind globe -->
  <circle cx="200" cy="215" r="140" fill="#7c3aed" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Globe outer ring -->
  <circle cx="200" cy="220" r="125" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>

  <!-- Globe body -->
  <circle cx="200" cy="220" r="115" fill="url(#globeGrad)" filter="url(#glow)"/>
  <circle cx="200" cy="220" r="115" fill="url(#gridPattern)" opacity="0.3"/>
  <circle cx="200" cy="220" r="115" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

  <!-- Globe grid lines -->
  <g clip-path="url(#globeClip)" opacity="0.35">
    <!-- Latitude lines -->
    <ellipse cx="200" cy="220" rx="115" ry="28" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <ellipse cx="200" cy="220" rx="115" ry="58" fill="none" stroke="#ffffff" stroke-width="1"/>
    <ellipse cx="200" cy="220" rx="115" ry="88" fill="none" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Longitude lines -->
    <ellipse cx="200" cy="220" rx="40" ry="115" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <ellipse cx="200" cy="220" rx="78" ry="115" fill="none" stroke="#ffffff" stroke-width="1"/>
    <ellipse cx="200" cy="220" rx="100" ry="115" fill="none" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="85" y1="220" x2="315" y2="220" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="200" y1="105" x2="200" y2="335" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Highlight/shine on globe -->
  <ellipse cx="165" cy="180" rx="35" ry="25" fill="#ffffff" opacity="0.12" filter="url(#softGlow)"/>
  <ellipse cx="158" cy="175" rx="16" ry="10" fill="#ffffff" opacity="0.25"/>

  <!-- Data chart bars rising from globe (right side) -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="270" y="180" width="22" height="80" rx="4" fill="url(#barGrad)" opacity="0.9"/>
    <rect x="270" y="180" width="22" height="80" rx="4" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Bar 2 (tallest) -->
    <rect x="300" y="150" width="22" height="110" rx="4" fill="url(#barGrad2)" opacity="0.9"/>
    <rect x="300" y="150" width="22" height="110" rx="4" fill="none" stroke="#67e8f9" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Bar 3 -->
    <rect x="330" y="165" width="22" height="95" rx="4" fill="url(#barGrad3)" opacity="0.9"/>
    <rect x="330" y="165" width="22" height="95" rx="4" fill="none" stroke="#f472b6" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Bar 4 (medium) -->
    <rect x="360" y="190" width="22" height="70" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="360" y="190" width="22" height="70" rx="4" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Floor line under bars -->
  <line x1="265" y1="260" x2="390" y2="260" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>

  <!-- Trend line overlay on bars -->
  <polyline points="281,230 311,195 341,215 371,225" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" filter="url(#glow)"/>
  <circle cx="281" cy="230" r="3" fill="#ec4899" opacity="0.7"/>
  <circle cx="311" cy="195" r="3" fill="#ec4899" opacity="0.7"/>
  <circle cx="341" cy="215" r="3" fill="#ec4899" opacity="0.7"/>
  <circle cx="371" cy="225" r="3" fill="#ec4899" opacity="0.7"/>

  <!-- Orbiting ring arc -->
  <path d="M 120 140 Q 200 95 280 140" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>

  <!-- Small dots on orbit -->
  <circle cx="120" cy="140" r="4" fill="#7c3aed" opacity="0.8" filter="url(#glow)"/>
  <circle cx="200" cy="95" r="3" fill="#06b6d4" opacity="0.8" filter="url(#glow)"/>
  <circle cx="280" cy="140" r="4" fill="#ec4899" opacity="0.8" filter="url(#glow)"/>

  <!-- "SWA" text -->
  <text x="400" y="355" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="url(#ringGrad)" letter-spacing="6" text-anchor="middle" filter="url(#glow)">SWA</text>

  <!-- Analysis nodes (small floating dots) -->
  <circle cx="100" cy="360" r="3" fill="#7c3aed" opacity="0.4"/>
  <circle cx="360" cy="370" r="2.5" fill="#06b6d4" opacity="0.35"/>
  <circle cx="370" cy="100" r="2" fill="#ec4899" opacity="0.3"/>
  <circle cx="80" cy="160" r="2.5" fill="#a78bfa" opacity="0.3"/>

  <!-- Corner accent dots -->
  <circle cx="90" cy="90" r="4" fill="#7c3aed" opacity="0.15"/>
  <circle cx="420" cy="420" r="3" fill="#06b6d4" opacity="0.15"/>
</svg>
